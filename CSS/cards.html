<!DOCTYPE html>
<html lang="en">
<head>

    <title>Responsive Cards</title>
    <link rel="stylesheet" href="cards.css">
</head>
<body>
    <div class="grid">
        <div class="card">
            <h3>Notebook</h3>
            <p>Rs. 50</p>

        </div>
        <div class="card">
            <h3>Bottle</h3>
            <p>Rs. 150</p>
        </div>
    </div>
</body>
</html>
