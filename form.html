<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        label, input, textarea {
                display: block;
        }

        input, textarea {
            margin-bottom: 15px;
        }
     </style>
</head>
<body>
    <h1>Contact Us.</h1>
    <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Write your name">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Write your email">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Write your message here"> </textarea>
        <button type="submit">Submit</button>
    </form>

</body>
</html>
