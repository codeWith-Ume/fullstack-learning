<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables and Lists</title>
</head>
<body>
    <h1>My Result</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Subject</th>
                <th>Marks</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>HTML</td>
                <td>50</td>
                <td>B</td>
            </tr>
            <tr>
                <td>CSS</td>
                <td>87</td>
                <td>A</td>
            </tr>
            <tr>
                <td>JS</td>
                <td>70</td>
                <td>B</td>
            </tr>
        </tbody>
    </table>
    <h2>My Routine</h2>
    <ol>
        <li>Wokeup at 8</li>
        <li>Get ready by 8:30</li>
        <li>Breakfast by 8:50</li>
    </ol>
    <h2>Skills</h2>
    <ul>
        <li>Frontend</li>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
            </ul>
        <li>Backend</li>
            <ul>
                <li>Django</li>
                <li>FastAPI</li>
            </ul>
    </ul>

    
</body>
</html>
