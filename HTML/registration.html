<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
     <style>
        body {
            font-family: sens-serif;
        }
        form {
            width: 300px;
        }
        label, input , fieldset {
            display: block;
        }
        label, input {
            margin-bottom: 10px;
        }
        input[type="checkbox"] {
            display: inline-block;
            margin-bottom: 0;
        }
     </style>
<body>
    <h1>Create Your Account</h1>
    <form action="#" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required minlength="5">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">

        <label for="confirm-password">Retype Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required minlength="8">

        <label for="contact">Contact</label>
        <input type="tel" id="contact" name="contact" pattern="[0-9]{10}" placeholder="10 digit number">

        <label for="gender">Gender</label>
        <select id="gender" name="gender">
            <option value="" disabled selected>Select gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>

        <label>
            <input type="checkbox" name="terms" required>
            I agree to the terms and conditions
        </label>

        <button type="submit">Register</button>
        <button type="reset">Clear</button>
    </form   
</body>
</html>
